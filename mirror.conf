server {
    listen 80;
    server_name ~^(?<sub_domain>.+\.)?mirror\.altamino\.top$;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    location / {
        set $target_host "${sub_domain}altamino.top";

        proxy_pass https://$target_host;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host $target_host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Accept-Encoding "";

        proxy_set_header Referer "https://$target_host$request_uri";
        proxy_set_header Origin "https://$target_host";

        proxy_redirect ~^(https?://)([^/]+\.)?altamino\.top(.*)$ $1$2mirror.altamino.top$3;
        proxy_cookie_domain ~^(.+\.)?altamino\.top$ $1mirror.altamino.top;

        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;
        proxy_hide_header X-Frame-Options;

        header_filter_by_lua_block {
            ngx.header.content_length = nil
        }

        body_filter_by_lua_block {
            if ngx.status == 101 then
                return
            end

            local content_type = ngx.header.content_type or ""
            if not (string.find(content_type, "text/") or 
                    string.find(content_type, "javascript") or 
                    string.find(content_type, "json") or 
                    string.find(content_type, "xml")) then
                return
            end

            local chunk = ngx.arg[ 1 ]
            local eof = ngx.arg[ 2 ]

            if ngx.ctx.buffered == nil then
                ngx.ctx.buffered = {}
            end

            if chunk ~= "" and chunk ~= nil then
                table.insert(ngx.ctx.buffered, chunk)
            end

            if eof then
                local whole = table.concat(ngx.ctx.buffered)
                ngx.ctx.buffered = nil

                whole = ngx.re.gsub(whole, [[((?:[a-zA-Z0-9-]+\.)*)altamino\.top]], "$1mirror.altamino.top", "ijo")
                whole = ngx.re.gsub(whole, [[\s+integrity=["'][^"']+["']]], "", "ijo")

                ngx.arg[ 1 ] = whole
            else
                ngx.arg[ 1 ] = nil
            end
        }
    }
}
