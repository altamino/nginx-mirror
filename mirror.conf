server {
    listen 80;
    server_name service.mirror.altamino.top;

    client_max_body_size 5M;

    location / {
        proxy_pass https://service.altamino.top;
        proxy_set_header Host service.altamino.top;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_pass_request_headers on;
        proxy_pass_request_body on;

		proxy_ssl_server_name on;
        proxy_ssl_name service.altamino.top;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}

server {
    listen 80;
    server_name ws.mirror.altamino.top;

    client_max_body_size 0;

    location / {
        proxy_pass https://ws.altamino.top;

        proxy_set_header Host ws.altamino.top;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

		proxy_ssl_server_name on;
        proxy_ssl_name ws.altamino.top;
    }
}

